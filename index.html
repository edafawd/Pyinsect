<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pyinsect Photo Collector</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #ffffff; }
    .box { border: 2px dashed #888; padding: 30px; text-align: center; margin-top: 15px; border-radius: 8px; }
    button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Pyinsect Photo Collector</h1>
  <p>Select an insect name and add photos to build your dataset.</p>

  <label for="bug-name">Insect Name:</label>
  <input type="text" id="bug-name" placeholder="e.g., ladybug">

  <div class="box">
    <p>Drag & drop insect photos here</p>
    <input type="file" id="file-input" multiple accept="image/*">
  </div>

  <br>
  <button id="download-btn">Download Zip</button>

</body>
</html>
